<aside class="col-md-3">
    <!--   SIDEBAR   -->
    <style>
        .dashboard-menu {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .dashboard-menu .menu-item {
            border: none;
            border-bottom: 1px solid #f0f0f0;
            padding: 16px 20px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #333;
            text-decoration: none;
        }
        .dashboard-menu .menu-item:last-child {
            border-bottom: none;
        }
        .dashboard-menu .menu-item:hover {
            background: #f8f9fa;
            padding-left: 24px;
            color: #007bff;
        }
        .dashboard-menu .menu-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 500;
        }
        .dashboard-menu .menu-item.active:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .dashboard-menu .menu-item i {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }
        .logout-btn {
            margin-top: 20px;
            border-radius: 8px;
            border: 2px solid #dc3545;
            background: white;
            color: #dc3545;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .logout-btn:hover {
            background: #dc3545;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220,53,69,0.3);
        }
    </style>
    
    <ul class="list-group dashboard-menu">
        <a class="menu-item {% if '/accounts/' == request.path %}active{% endif %}" href="{% url 'dashboard' %}">
            <i class="fas fa-tachometer-alt"></i>
            <span>Pannello di controllo</span>
        </a>
        <a class="menu-item {% if '/my_orders/' in request.path or '/order_detail/' in request.path %}active{% endif %}" href="{% url 'my_orders' %}">
            <i class="fas fa-shopping-bag"></i>
            <span>I miei Ordini e Biglietti</span>
        </a>
        <a class="menu-item {% if '/subscriptions/' in request.path %}active{% endif %}" href="{% url 'subscriptions' %}">
            <i class="fas fa-id-card"></i>
            <span>Gestione Abbonamenti</span>
        </a>
        <a class="menu-item {% if '/edit_profile/' in request.path %}active{% endif %}" href="{% url 'edit_profile' %}">
            <i class="fas fa-user-edit"></i>
            <span>Il mio profilo</span>
        </a>
        <a class="menu-item {% if '/change_password/' in request.path %}active{% endif %}" href="{% url 'change_password' %}">
            <i class="fas fa-key"></i>
            <span>Cambia la Password</span>
        </a>
        {% if user.is_admin or user.is_staff %}
        <a class="menu-item {% if '/printer-test/' in request.path %}active{% endif %}" href="{% url 'printer_test' %}">
            <i class="fas fa-print"></i>
            <span>Test Stampante</span>
        </a>
        {% endif %}
    </ul>
    <br>
    <a class="btn logout-btn btn-block" href="{% url 'logout' %}">
        <i class="fa fa-power-off"></i> 
        <span class="text">Esci (dal sito) - Logout</span>
    </a>
    <!--   SIDEBAR .//END   -->
</aside>
