# pytest configuration
[tool:pytest]
DJANGO_SETTINGS_MODULE = ltcboxoffice.settings.development
python_files = tests.py test_*.py *_tests.py
testpaths = .
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
norecursedirs = 
    migrations
    static
    staticfiles
    media
    node_modules
    .git
    .venv
    venv
    env
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
